[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stephanixx-vidgen_jd414"
version = "0.1.0"
description = "把候选项映射到类别上，算出文生视频工程师·函数调用的 schema 校验的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "stephanixx" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://stephanixx.github.io"
Repository = "https://github.com/stephanixx/vidgen_jd414"
Issues = "https://github.com/stephanixx/vidgen_jd414/issues"

[project.scripts]
vidgen_jd414 = "vidgen_jd414:main"

[tool.setuptools]
py-modules = ["vidgen_jd414"]
